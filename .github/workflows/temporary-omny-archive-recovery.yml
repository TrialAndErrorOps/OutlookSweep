name: Temporary Omny archive recovery

on:
  push:
    paths:
      - .github/workflows/temporary-omny-archive-recovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Recover archived RSS item and audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          python3 - <<'PY'
          import json
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          out = Path('recovery')
          out.mkdir(exist_ok=True)
          log_lines = []

          ORG = 'eea6f6e8-242e-442d-826d-a59b004c5ec9'
          PROGRAM = 'facea92d-da32-4a67-be02-a59b004f7a4c'
          PLAYLIST = '024e8d7b-8c4f-4e65-ae81-a59b00511905'
          RSS_HTTP_PORT = f'http://www.omnycontent.com:80/d/playlist/{ORG}/{PROGRAM}/{PLAYLIST}/podcast.rss'
          RSS_HTTP = f'http://www.omnycontent.com/d/playlist/{ORG}/{PROGRAM}/{PLAYLIST}/podcast.rss'
          RSS_HTTPS = f'https://www.omnycontent.com/d/playlist/{ORG}/{PROGRAM}/{PLAYLIST}/podcast.rss'
          PODBAY = 'https://podbay.fm/p/the-program/e/1555524951'
          TARGET_TS = '20190417182220'

          def log(msg):
              print(msg, flush=True)
              log_lines.append(str(msg))

          def fetch(url, timeout=120, headers=None):
              merged = {
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
                  'Accept': '*/*',
                  'Accept-Language': 'en-US,en;q=0.9',
              }
              if headers:
                  merged.update(headers)
              req = urllib.request.Request(url, headers=merged)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read(), dict(response.headers), response.geturl(), response.status

          def try_fetch(url, label):
              for attempt in range(1, 4):
                  try:
                      body, headers, final_url, status = fetch(url)
                      log(f'{label}: HTTP {status}, {len(body)} bytes, final={final_url}')
                      return body, headers, final_url
                  except Exception as exc:
                      log(f'{label}: attempt {attempt} failed: {type(exc).__name__}: {exc}')
                      time.sleep(attempt * 3)
              return None

          # First get the capture inventory. This also records useful diagnostics if replay fails.
          cdx_url = (
              'https://web.archive.org/cdx/search/cdx?url=' + urllib.parse.quote(RSS_HTTPS, safe='') +
              '&from=2019&to=2021&output=json&fl=timestamp,original,statuscode,mimetype,digest,length'
              '&filter=statuscode:200&collapse=digest'
          )
          cdx = try_fetch(cdx_url, 'CDX RSS inventory')
          captures = []
          if cdx:
              (out / 'cdx-rss.json').write_bytes(cdx[0])
              try:
                  rows = json.loads(cdx[0])
                  if rows and isinstance(rows[0], list):
                      captures = [dict(zip(rows[0], row)) for row in rows[1:]]
                  log(f'Parsed {len(captures)} CDX RSS captures')
              except Exception as exc:
                  log(f'Could not parse CDX inventory: {exc}')

          replay_candidates = [
              f'https://web.archive.org/web/{TARGET_TS}id_/{RSS_HTTP_PORT}',
              f'https://web.archive.org/web/{TARGET_TS}id_/{RSS_HTTP}',
              f'https://web.archive.org/web/{TARGET_TS}id_/{RSS_HTTPS}',
              f'http://web.archive.org/web/{TARGET_TS}id_/{RSS_HTTP_PORT}',
              f'https://web.archive.org/web/{TARGET_TS}/{RSS_HTTP_PORT}',
          ]

          # Add CDX captures nearest April 17, then later captures as fallbacks.
          for cap in sorted(captures, key=lambda c: (abs(int(c.get('timestamp','0')[:8] or 0) - 20190417), c.get('timestamp',''))):
              ts = cap.get('timestamp')
              original = cap.get('original')
              if ts and original:
                  replay_candidates.append(f'https://web.archive.org/web/{ts}id_/{original}')

          seen = set()
          rss_body = None
          rss_source = None
          for idx, url in enumerate(replay_candidates):
              if url in seen:
                  continue
              seen.add(url)
              result = try_fetch(url, f'RSS replay {idx+1}')
              if not result:
                  continue
              body = result[0]
              lower = body[:10000].lower()
              if (b'<rss' in lower or b'<channel' in lower or b'<item' in lower) and len(body) > 1000:
                  rss_body = body
                  rss_source = result[2]
                  (out / 'archived-feed.rss').write_bytes(body)
                  log(f'Accepted archived RSS from {rss_source}')
                  break
              else:
                  (out / f'replay-nonrss-{idx+1}.bin').write_bytes(body)
                  log('Replay response did not look like RSS')

          def local_name(tag):
              return tag.rsplit('}', 1)[-1].lower()

          def child_text(item, wanted):
              for child in list(item):
                  if local_name(child.tag) == wanted.lower():
                      return ''.join(child.itertext()).strip()
              return ''

          def child(item, wanted):
              for c in list(item):
                  if local_name(c.tag) == wanted.lower():
                      return c
              return None

          target_records = []
          chosen = None
          if rss_body:
              # Strip Wayback's occasional prepended banner/noise before XML.
              start = min([p for p in [rss_body.find(b'<?xml'), rss_body.find(b'<rss')] if p >= 0] or [0])
              clean = rss_body[start:]
              try:
                  root = ET.fromstring(clean)
                  items = [node for node in root.iter() if local_name(node.tag) == 'item']
                  log(f'RSS contains {len(items)} items')
                  for item in items:
                      enclosure = child(item, 'enclosure')
                      rec = {
                          'title': child_text(item, 'title'),
                          'pubDate': child_text(item, 'pubDate'),
                          'guid': child_text(item, 'guid'),
                          'link': child_text(item, 'link'),
                          'description': child_text(item, 'description'),
                          'enclosure_url': enclosure.attrib.get('url','') if enclosure is not None else '',
                          'enclosure_type': enclosure.attrib.get('type','') if enclosure is not None else '',
                          'enclosure_length': enclosure.attrib.get('length','') if enclosure is not None else '',
                          'raw_xml': ET.tostring(item, encoding='unicode'),
                      }
                      hay = ' '.join(str(v) for v in rec.values())
                      if re.search(r'Frank Boal|Robert Kraft|31:07|1555524951', hay, re.I):
                          target_records.append(rec)
                  log(f'Found {len(target_records)} target-like RSS items')
                  if target_records:
                      chosen = max(
                          target_records,
                          key=lambda r: (
                              bool(re.search(r'31:07|Robert Kraft', ' '.join(r.values()), re.I)),
                              '17 Apr 2019' in r.get('pubDate','') or 'Apr 17' in r.get('pubDate',''),
                              bool(r.get('enclosure_url')),
                          )
                      )
              except Exception as exc:
                  log(f'RSS parse failed: {type(exc).__name__}: {exc}')
                  (out / 'rss-parse-error.txt').write_text(repr(exc), encoding='utf-8')

          (out / 'target-candidates.json').write_text(json.dumps(target_records, indent=2), encoding='utf-8')
          if chosen:
              (out / 'target.json').write_text(json.dumps(chosen, indent=2), encoding='utf-8')
              (out / 'target-item.xml').write_text(chosen['raw_xml'], encoding='utf-8')
              log('CHOSEN TITLE: ' + chosen.get('title',''))
              log('CHOSEN DATE: ' + chosen.get('pubDate',''))
              log('CHOSEN GUID: ' + chosen.get('guid',''))
              log('CHOSEN ENCLOSURE: ' + chosen.get('enclosure_url',''))

              audio_url = chosen.get('enclosure_url','').replace('&amp;', '&')
              if audio_url:
                  audio_urls = [audio_url]
                  if 'traffic.omny.fm' in audio_url and 'download=' not in audio_url:
                      audio_urls.insert(0, audio_url + ('&' if '?' in audio_url else '?') + 'download=true')
                  for n, url in enumerate(audio_urls, 1):
                      result = try_fetch(url, f'Audio download {n}')
                      if result and len(result[0]) > 100000:
                          suffix = '.mp3'
                          ctype = result[1].get('Content-Type','').lower()
                          if 'mp4' in ctype or audio_url.lower().endswith('.m4a'):
                              suffix = '.m4a'
                          audio_path = out / ('recovered-2019-04-17-hour-3' + suffix)
                          audio_path.write_bytes(result[0])
                          log(f'SAVED AUDIO: {audio_path} ({audio_path.stat().st_size} bytes)')
                          break
              else:
                  log('Chosen RSS item had no enclosure URL')

          # Podbay Wayback fallback if RSS did not produce an enclosure.
          if not any(out.glob('recovered-2019-04-17-hour-3.*')):
              avail_url = 'https://archive.org/wayback/available?url=' + urllib.parse.quote(PODBAY, safe='') + '&timestamp=20190418'
              avail = try_fetch(avail_url, 'Podbay Wayback availability')
              if avail:
                  (out / 'podbay-availability.json').write_bytes(avail[0])
                  try:
                      snapshot = json.loads(avail[0]).get('archived_snapshots',{}).get('closest',{})
                      purl = snapshot.get('url')
                      if purl:
                          purl = purl.replace('/web/', '/web/').replace('http://web.archive.org/', 'https://web.archive.org/')
                          # id_ gives original bytes without toolbar rewriting.
                          purl = re.sub(r'/web/(\d{14})/', r'/web/\1id_/', purl)
                          pdata = try_fetch(purl, 'Podbay replay')
                          if pdata:
                              (out / 'podbay-snapshot.html').write_bytes(pdata[0])
                              text = pdata[0].decode('utf-8', errors='replace')
                              urls = sorted(set(re.findall(r'https?[^\"\'<>\s]+(?:traffic\.omny\.fm|omnycontent\.com)[^\"\'<>\s]*', text, re.I)))
                              (out / 'podbay-media-urls.txt').write_text('\n'.join(urls), encoding='utf-8')
                              log(f'Podbay media URL candidates: {len(urls)}')
                  except Exception as exc:
                      log(f'Podbay fallback failed: {exc}')

          (out / 'recovery.log').write_text('\n'.join(log_lines) + '\n', encoding='utf-8')
          summary = {
              'rss_source': rss_source,
              'target_count': len(target_records),
              'chosen_title': chosen.get('title') if chosen else None,
              'chosen_date': chosen.get('pubDate') if chosen else None,
              'chosen_guid': chosen.get('guid') if chosen else None,
              'chosen_enclosure': chosen.get('enclosure_url') if chosen else None,
              'audio_files': [str(p) for p in out.glob('recovered-2019-04-17-hour-3.*')],
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          log('SUMMARY: ' + json.dumps(summary))
          PY

          ls -lah recovery

      - name: Upload recovery results
        uses: actions/upload-artifact@v4
        with:
          name: omny-archive-recovery
          path: recovery/
          if-no-files-found: error
          retention-days: 1

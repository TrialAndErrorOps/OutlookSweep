<!doctype html>
<meta charset="utf-8">
<title>Temporary Omny Archive Probe</title>
<style>body{font:16px/1.35 ui-monospace,Consolas,monospace;margin:18px;background:white;color:#111}pre{white-space:pre-wrap;word-break:break-word}</style>
<pre id="out">HTML loaded. JavaScript has not started.</pre>
<script>
var out=document.getElementById('out');
window.onerror=function(message,source,line,column,error){out.textContent+='\nONERROR: '+message+' @ '+line+':'+column;};
function add(s){out.textContent+=String(s)+'\n';}
(async function(){
 out.textContent='JAVASCRIPT STARTED\n';
 var rss='https://www.omnycontent.com/d/playlist/eea6f6e8-242e-442d-826d-a59b004c5ec9/facea92d-da32-4a67-be02-a59b004f7a4c/024e8d7b-8c4f-4e65-ae81-a59b00511905/podcast.rss';
 var q='https://web.archive.org/cdx/search/cdx?url='+encodeURIComponent(rss)+'&from=2018&to=2022&output=json&fl=timestamp,original,statuscode,mimetype,digest,length&filter=statuscode:200&collapse=digest';
 add('REQUEST: '+q);
 try{
  var r=await fetch(q);
  add('STATUS: '+r.status+' '+r.statusText);
  var t=await r.text();
  add('BYTES: '+t.length);
  add(t.slice(0,12000));
 }catch(e){add('FETCH ERROR: '+e.name+' '+e.message+'\n'+e.stack);}
 add('DONE');
})();
</script>
